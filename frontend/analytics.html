<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bandung Flood Digital Twin - Data Analytics</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    
    <style>
        body { background: #f3f4f6; color: #333; overflow-y: auto; }
        .analytics-header { background: #333; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center;}
        .analytics-container { padding: 30px; display: grid; grid-template-columns: 1fr 1fr; gap: 30px; max-width: 1200px; margin: 0 auto;}
        .chart-card { background: white; border-radius: 8px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .chart-card h3 { margin-bottom: 15px; font-size: 1.1rem; color: #1e40af; border-bottom: 2px solid #e5e7eb; padding-bottom: 10px;}
        .nav-link { color: #fff; text-decoration: none; background: #4285f4; padding: 8px 16px; border-radius: 4px; font-weight: 500;}
        .nav-link:hover { background: #3367d6; }
    </style>
</head>
<body>
    
    <div class="analytics-header">
        <h2>City Scale Flood Impact & Data Analytics</h2>
        <a href="#" onclick="window.close(); return false;" class="nav-link">✖ Close Dashboard</a>
    </div>

    <div class="analytics-container">
        <!-- Chart 1: Line Chart (SCS-CN Rain vs Runoff) -->
        <div class="chart-card">
            <h3>Rainfall vs Runoff Time Series (SCS-CN)</h3>
            <canvas id="timeSeriesChart"></canvas>
        </div>

        <!-- Chart 2: Scatter Plot (Rainfall Intensity vs Depth) -->
        <div class="chart-card">
            <h3>Historical Events: Rainfall vs Inundation Area</h3>
            <canvas id="scatterChart"></canvas>
        </div>

        <!-- Chart 3: Bar Chart (Damage by Type) -->
        <div class="chart-card">
            <h3>Flood Damage by Property Type</h3>
            <canvas id="barChart"></canvas>
        </div>

        <!-- Chart 4: Flood Depth Distribution -->
        <div class="chart-card">
            <h3>Flood Depth Distribution (Simulated Area)</h3>
            <canvas id="depthDistChart"></canvas>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        // 1. Time Series Line Chart
        const tsChart = new Chart(document.getElementById('timeSeriesChart'), {
            type: 'line',
            data: {
                labels: ['00:00','04:00','08:00','12:00','16:00','20:00','24:00'],
                datasets: [
                    { label: 'Rainfall (mm)', data: [0, 20, 80, 150, 160, 165, 170], borderColor: '#3b82f6', tension: 0.4, fill: true, backgroundColor: 'rgba(59, 130, 246, 0.2)' },
                    { label: 'Runoff (mm)', data: [0, 5, 45, 110, 125, 130, 132], borderColor: '#ef4444', tension: 0.4, fill: true, backgroundColor: 'rgba(239, 68, 68, 0.2)' }
                ]
            },
            options: {
                responsive: true,
                scales: {
                    x: { title: { display: true, text: 'Time (hours)', font: { weight: 'bold' } } },
                    y: { title: { display: true, text: 'Cumulative Depth (mm)', font: { weight: 'bold' } } }
                }
            }
        });

        // 2. Scatter Plot
        const scChart = new Chart(document.getElementById('scatterChart'), {
            type: 'scatter',
            data: {
                datasets: [{
                    label: 'Historical Flood Events',
                    data: [
                        {x: 50, y: 10}, {x: 80, y: 40}, {x: 120, y: 90}, {x: 150, y: 140}, {x: 200, y: 220}, {x: 250, y: 310}
                    ],
                    backgroundColor: '#f59e0b',
                    pointRadius: 6
                }]
            },
            options: {
                responsive: true,
                scales: {
                    x: { title: { display: true, text: 'Rainfall Intensity (mm)' } },
                    y: { title: { display: true, text: 'Inundation Area (Ha)' } }
                }
            }
        });

        // 3. Bar Chart
        const barChart = new Chart(document.getElementById('barChart'), {
            type: 'bar',
            data: {
                labels: ['Residential', 'Commercial', 'Industrial', 'Public Infra'],
                datasets: [{
                    label: 'Damage Cost ($)',
                    data: [4500000, 2800000, 1200000, 3500000],
                    backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#ef4444']
                }]
            },
            options: { responsive: true }
        });

        // 4. Flood Depth Distribution Chart
        const depthDistChart = new Chart(document.getElementById('depthDistChart'), {
            type: 'bar',
            data: {
                labels: ['0 – 0.5 m', '0.5 – 1.0 m', '1.0 – 2.0 m', '2.0 – 3.0 m', '> 3.0 m'],
                datasets: [{
                    label: 'Flooded Area (Ha)',
                    data: [0, 0, 0, 0, 0],
                    backgroundColor: [
                        'rgba(96, 165, 250, 0.85)',
                        'rgba(59, 130, 246, 0.85)',
                        'rgba(37, 99, 235, 0.85)',
                        'rgba(30, 64, 175, 0.85)',
                        'rgba(88, 28, 135, 0.85)'
                    ],
                    borderColor: [
                        '#60a5fa', '#3b82f6', '#2563eb', '#1e40af', '#581c87'
                    ],
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                scales: {
                    x: { title: { display: true, text: 'Flood Depth Category', font: { weight: 'bold' } } },
                    y: { title: { display: true, text: 'Affected Area (Ha)', font: { weight: 'bold' } }, beginAtZero: true }
                },
                plugins: {
                    tooltip: {
                        callbacks: {
                            label: function(ctx) { return ctx.parsed.y.toFixed(1) + ' Ha'; }
                        }
                    }
                }
            }
        });
        
        // --- DYNAMIC DATA INJECTION ---
        const simStatsStr = localStorage.getItem('floodSimStats');
        if (simStatsStr) {
            const stats = JSON.parse(simStatsStr);
            
            // 1. Update Time Series
            // Support both old and new data structures
            const maxP = parseFloat(stats.rainfall || stats.p || 0);
            const maxR = parseFloat(stats.runoff || stats.avgRunoff || 0);
            tsChart.data.datasets[0].data = [0, maxP*0.2, maxP*0.6, maxP*0.8, maxP*0.9, maxP, maxP];
            tsChart.data.datasets[1].data = [0, maxR*0.1, maxR*0.3, maxR*0.7, maxR*0.9, maxR, maxR];
            tsChart.update();
            
            // 2. Update Scatter Plot (Add Current Event)
            scChart.data.datasets[0].data.push({ x: maxP, y: parseFloat(stats.areaHa || 0) });
            // Color current event red
            scChart.data.datasets[0].backgroundColor = (ctx) => {
                return ctx.dataIndex === scChart.data.datasets[0].data.length - 1 ? '#ef4444' : '#f59e0b';
            };
            scChart.data.datasets[0].pointRadius = (ctx) => {
                return ctx.dataIndex === scChart.data.datasets[0].data.length - 1 ? 10 : 6;
            };
            scChart.data.datasets[0].label = 'Historical & Current Simulation';
            scChart.update();
            
            // 3. Update Bar Chart Damages
            // Fallback estimation if structDmg/contDmg not available in current app.js
            let struct = parseFloat(stats.structDmg || 0);
            let content = parseFloat(stats.contDmg || 0);
            
            if (struct === 0 && stats.floodedCells) {
                const propCount = Math.floor(stats.floodedCells * 2.5);
                struct = propCount * 28500;
                content = propCount * 15200;
            }

            barChart.data.datasets[0].data = [
                struct * 0.45,  // Residential
                struct * 0.30,  // Commercial
                struct * 0.25,  // Industrial
                content         // Public infra / Content
            ];
            barChart.update();
            
            // 4. Update Flood Depth Distribution from simulation grid
            // Fetch the latest simulation data to compute depth histogram
            (async function() {
                try {
                    const simP = parseFloat(stats.rainfall || 150);
                    const res = await fetch('/api/simulation/hydraulics', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ P: simP })
                    });
                    const data = await res.json();
                    if (data.grid && data.rows && data.cols) {
                        const bounds = data.bounds;
                        const bW = (bounds[1][1] - bounds[0][1]) * 111;
                        const bH = (bounds[1][0] - bounds[0][0]) * 111;
                        const cellAreaHa = (bW / data.cols) * (bH / data.rows) * 100;
                        
                        // Count cells per depth category
                        let bins = [0, 0, 0, 0, 0]; // 0-0.5, 0.5-1, 1-2, 2-3, >3
                        for (let r = 0; r < data.rows; r++) {
                            for (let c = 0; c < data.cols; c++) {
                                const h = data.grid[r][c].h;
                                if (h > 0) {
                                    if (h <= 0.5) bins[0]++;
                                    else if (h <= 1.0) bins[1]++;
                                    else if (h <= 2.0) bins[2]++;
                                    else if (h <= 3.0) bins[3]++;
                                    else bins[4]++;
                                }
                            }
                        }
                        // Convert cell counts to hectares
                        depthDistChart.data.datasets[0].data = bins.map(b => parseFloat((b * cellAreaHa).toFixed(1)));
                        depthDistChart.update();
                    }
                } catch(e) {
                    console.error('Depth distribution fetch error:', e);
                }
            })();
        }
    </script>
</body>
</html>
